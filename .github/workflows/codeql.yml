name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes a las 06:00 UTC, además de en cada push/PR a main.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Análisis de CodeQL (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Para JavaScript/TypeScript CodeQL analiza el código fuente directamente,
      # no necesita compilar el proyecto (build-mode: none).
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Ejecutar el análisis de CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
