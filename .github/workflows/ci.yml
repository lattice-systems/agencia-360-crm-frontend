name: CI

# Corre en cada push a cualquier rama (main está protegida, así que el trabajo
# diario vive en ramas de feature) y en cada PR hacia main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Si llegan varios push seguidos a la misma rama o PR, cancela la corrida
# anterior: no tiene sentido esperar un build viejo si ya hay uno más nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cada revisión es un job aparte (corren en paralelo): así en el PR aparece un
# check por cada una y se ve de inmediato si falló el lint, el build o las pruebas.
jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias (según package-lock.json)
        run: npm ci

      - name: Revisar el código con ESLint
        run: npm run lint

  build:
    name: Build (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias (según package-lock.json)
        run: npm ci

      - name: Revisar tipos y generar el build
        run: npm run build

  pruebas:
    name: Pruebas (Vitest + React Testing Library)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias (según package-lock.json)
        run: npm ci

      - name: Correr las pruebas
        run: npm test
